[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-app"
version = "0.1.0"
description = "Production-ready RAG system with robust data prep, hybrid retrieval, smart orchestration, and observability"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "RetrievalApp Team"}
]
dependencies = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "tiktoken>=0.5.0",
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.2",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "structlog>=23.0.0",
    "prometheus-client>=0.17.0",
    "aiohttp>=3.8.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
